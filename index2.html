<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WORLDATING — Encontre alguém de outro mundo</title>

  <!-- Google Fonts: DM Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Blobs decorativos no fundo -->
  <div class="blob one"></div>
  <div class="blob two"></div>

  <div class="app-wrapper">
    <!-- Header / Abas -->
    <header class="app-header">
      <button class="tab-btn active" id="tabDiscover">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span>Descobrir</span>
      </button>
      
      <button class="tab-btn" id="tabMatches">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
        <span>Conversas</span>
        <span class="match-badge" id="matchBadge" style="display: none;">0</span>
      </button>
    </header>

    <!-- ABA 1: SWIPE -->
    <section class="tab-content active" id="viewDiscover">
      <main class="tinder-viewport" id="cardsContainer"></main>

      <div class="controls">
        <button class="action-btn btn-nope" id="nopeBtn" aria-label="Rejeitar">✕</button>
        <button class="action-btn btn-like" id="likeBtn" aria-label="Curtir">💗</button>
      </div>
    </section>

    <!-- ABA 2: CONVERSAS -->
    <section class="tab-content" id="viewMatches">
      <div class="chat-list-view" id="chatListView">
        <h2 class="chat-title">Novos Matches ✦</h2>
        <div class="matches-horizontal" id="matchesHorizontal"></div>

        <h2 class="chat-title" style="margin-top: 24px;">Mensagens</h2>
        <div class="conversations-list" id="conversationsList"></div>
      </div>

      <!-- Sala de Conversa -->
      <div class="chat-room-view" id="chatRoomView" style="display: none;">
        <div class="chat-room-header">
          <button class="back-chat-btn" id="backToChatList">←</button>
          <div class="chat-room-avatar" id="roomAvatar"></div>
          <div class="chat-room-info">
            <h3 id="roomName">Nome</h3>
            <span id="roomSpecies">Espécie</span>
          </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="dialogue-choices-area" id="dialogueChoicesArea">
          <div class="dialogue-hint">✦ Escolha uma resposta artificial pré-aprovada:</div>
          <div class="dialogue-options-list" id="dialogueOptionsList"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="database.js"></script>
  <script src="app.js"></script>
</body>
</html>
