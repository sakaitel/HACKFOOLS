<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');

  :root {
    --pink-bg: #fff7fb;
    --pink-light: #ffeaf4;
    --pink-soft: #ffd6e7;
    --pink: #ff8fbb;
    --pink-strong: #e95d96;
    --rose: #c83d73;

    --purple-soft: #eee3ff;
    --purple: #9670c9;

    --text: #513141;
    --muted: #9a7184;

    --white: #ffffff;

    --border: #f4d9e5;

    --shadow:
      0 25px 70px rgba(194, 73, 123, 0.13);
  }


  /* =========================================
     BASE
     ========================================= */

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background:
      radial-gradient(circle at 5% 5%,
        rgba(255, 190, 216, .55),
        transparent 27%),
      radial-gradient(circle at 95% 20%,
        rgba(225, 207, 250, .45),
        transparent 25%),
      var(--pink-bg);

    color: var(--text);
    min-height: 100vh;
  }


  /* =========================================
     PEQUENOS "PLANETAS" DECORATIVOS
     ========================================= */

  body::before {
    content: "✦";
    position: fixed;
    top: 90px;
    left: 4%;
    color: #ffafd0;
    font-size: 28px;
    opacity: .65;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "♡";
    position: fixed;
    right: 4%;
    bottom: 70px;
    color: #d4b6ed;
    font-size: 45px;
    opacity: .5;
    pointer-events: none;
    z-index: 0;
  }


  /* =========================================
     LAYOUT 2 : 3 : 2
     ========================================= */

  .formbold-main-wrapper {
    position: relative;
    z-index: 1;

    display: grid;
    grid-template-columns: 2fr 3fr 2fr;

    gap: 30px;

    width: 100%;
    min-height: 100vh;

    padding: 45px;

    align-items: start;
  }

  /* =========================================
     LATERAIS — IMAGENS INFINITAS
     ========================================= */

  .side-image {
    width: 100%;
    height: calc(100vh - 80px);

    position: sticky;
    top: 40px;

    overflow: hidden;

    border-radius: 30px;

    border: 6px solid rgba(255, 255, 255, .85);

    box-shadow:
      0 25px 60px rgba(180, 72, 120, .15);

    background: #ffeaf4;
  }


  .infinite-images {
    display: flex;
    flex-direction: column;

    width: 100%;

    /*
      O conteúdo tem várias cópias da mesma imagem.
      A animação desloca uma sequência inteira
      e reinicia de forma contínua.
    */

    animation:
      infiniteScroll 24s linear infinite;
  }


  .infinite-images img {
    display: block;

    width: 100%;

    height: auto;

    flex-shrink: 0;

    object-fit: cover;

    border: 0;

    border-radius: 0;

    box-shadow: none;
  }


  /*
   * Esquerda e direita podem ter velocidades
   * diferentes para ficar mais interessante.
   */

  .side-left .infinite-images {
    animation-duration: 27s;
  }

  .side-right .infinite-images {
    animation-duration: 21s;

    /*
     * Começa ligeiramente diferente da esquerda.
     */
    transform: translateY(-280px);
  }


  /*
   * Animação vertical contínua
   */

  @keyframes infiniteScroll {

    0% {
      transform: translateY(0);
    }

    100% {
      transform: translateY(-1680px);
    }

  }


  /*
   * Pequeno degradê nas bordas para deixar
   * o movimento mais suave.
   */

  .side-image::before {
    content: "";

    position: absolute;

    z-index: 2;

    top: 0;
    left: 0;
    right: 0;

    height: 90px;

    background:
      linear-gradient(
        to bottom,
        rgba(255,247,251,.9),
        transparent
      );

    pointer-events: none;
  }


  .side-image::after {
    content: "";

    position: absolute;

    z-index: 2;

    bottom: 0;
    left: 0;
    right: 0;

    height: 90px;

    background:
      linear-gradient(
        to top,
        rgba(255,247,251,.9),
        transparent
      );

    pointer-events: none;
  }


  /*
   * Pausa ao passar o mouse.
   * Pode remover se quiser movimento constante.
   */

  .side-image:hover .infinite-images {
    animation-play-state: paused;
  }


  /* =========================================
     MOBILE
     ========================================= */

  @media (max-width: 750px) {

    .side-image {
      display: none;
    }

  }


  /* =========================================
     FORMULÁRIO CENTRAL
     ========================================= */

  .formbold-form-wrapper {
    position: relative;

    width: 100%;

    background:
      linear-gradient(180deg,
        rgba(255, 255, 255, .98),
        rgba(255, 250, 253, .98));

    padding: 42px;

    border-radius: 34px;

    border: 1px solid rgba(255, 211, 228, .9);

    box-shadow: var(--shadow);
  }

  /*
    Pequeno detalhe decorativo no topo
  */

  .formbold-form-wrapper::before {
    content: "WORLDATING  ✦  CREATE YOUR PROFILE";

    display: block;

    margin-bottom: 30px;

    text-align: center;

    color: var(--pink-strong);

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 2px;
  }


  /* =========================================
     TÍTULOS DAS SEÇÕES
     ========================================= */

  .section-title {
    display: flex;

    gap: 13px;

    margin-top: 40px;

    padding-bottom: 16px;

    font-size: 12px;
    font-weight: 800;

    box-shadow:

  .section-title h2 {
    font-family: 'Playfair Display', serif;

    font-size: 27px;

    letter-spacing: -.6px;

    color: #513141;
  }


  /* =========================================
     CAMPOS
     ========================================= */

  .formbold-mb-5 {
    margin-bottom: 25px;
  }

  .formbold-form-label {
    display: block;

    margin-bottom: 9px;

    color: #765568;

    font-size: 13px;

    font-weight: 700;

    line-height: 1.65;
  }

  .formbold-form-input {
    width: 100%;

    padding: 14px 16px;

    border:
      1px solid #f0d6e2;

    border-radius: 14px;

    background: #fffafd;

    color: #68485a;

    font-family: 'DM Sans', sans-serif;

    font-size: 14px;

    outline: none;

    transition:
      border-color .2s,
      box-shadow .2s,
      background .2s,
      transform .2s;
  }

  .formbold-form-input:hover {
    background: #ffffff;

    border-color: #f4bfd5;
  }

  .formbold-form-input:focus {
    background: white;

    border-color: var(--pink);

    box-shadow:
      0 0 0 4px rgba(255, 143, 187, .12);

    transform: translateY(-1px);
  }

  .formbold-form-input::placeholder {
    color: #c09bab;
  }

  select.formbold-form-input {
    cursor: pointer;
  }


  /* =========================================
     OPÇÕES / RADIO
     ========================================= */

  .options-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
  }

  .options-grid.two {
    grid-template-columns: 1fr 1fr;
  }

  .options-grid.three {
    grid-template-columns: repeat(3, 1fr);
  }

  .option-card {
    position: relative;

    display: flex;
    align-items: center;

    min-height: 52px;

    padding: 11px 14px;

    border:
      1px solid #f0d9e4;

    border-radius: 15px;

    cursor: pointer;

    background: #fffafd;

    color: #68485a;

    font-size: 12px;

    line-height: 1.4;

    transition:
      transform .2s,
      border-color .2s,
      background .2s,
      box-shadow .2s;
  }

  .option-card:hover {
    transform: translateY(-2px);

    border-color: #f3a8c7;

    background: #fff3f8;

    box-shadow:
      0 8px 20px rgba(190, 73, 121, .08);
  }

  .option-card input {
    position: absolute;

    opacity: 0;

    pointer-events: none;
  }

  .option-card span {
    width: 100%;
  }

  .option-card input:checked+span {
    color: var(--rose);

    font-weight: 800;
  }

  .option-card:has(input:checked) {
    border-color: #ff9fc4;

    background:
      linear-gradient(135deg,
        #fff0f6,
        #ffe7f1);

    box-shadow:
      0 8px 22px rgba(226, 76, 132, .1);

    transform: translateY(-2px);
  }

  .option-card:has(input:checked)::after {
    content: "♥";

    position: absolute;

    top: 7px;
    right: 9px;

    color: var(--pink);

    font-size: 11px;
  }


  /* =========================================
     CONTADOR
     ========================================= */

  .profile-counter {
    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 9999;

    min-width: 165px;

    padding: 14px 18px;

    background:
      rgba(255, 255, 255, .92);

    border:
      1px solid #f3d2e1;

    border-radius: 20px;

    box-shadow:
      0 15px 40px rgba(179, 72, 117, .13);

    text-align: center;

    backdrop-filter: blur(12px);

    transition: .25s;
  }

  .profile-counter::before {
    content: "💗";

    display: block;

    margin-bottom: 3px;

    font-size: 15px;
  }

  .counter-label {
    display: block;

    margin-bottom: 3px;

    color: #a47b8d;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .3px;
  }

  .profile-counter strong {
    display: block;

    color: var(--rose);

    font-family: 'Playfair Display', serif;

    font-size: 24px;

    font-weight: 800;

    transition: .2s;
  }

  .profile-counter.changed {
    transform: scale(1.05);
  }


  /* =========================================
     BOTÃO
     ========================================= */

  .formbold-btn {
    width: 100%;

    margin-top: 18px;

    padding: 17px 25px;

    border: none;

    border-radius: 50px;

    background:
      linear-gradient(135deg,

    color: white;

    font-family: 'DM Sans', sans-serif;

    font-weight: 800;

      0 14px 30px rgba(224, 76, 132, .22);

    transition:
      transform .2s,
      box-shadow .2s,
      filter .2s;
  }

  .formbold-btn::before {
    content: "♥  ";
  }

  .formbold-btn:hover {
    transform: translateY(-3px);

    filter: brightness(1.03);

    box-shadow:
      0 19px 38px rgba(224, 76, 132, .3);

  .formbold-btn:active {

  /* =========================================

<script>

  /* =========================
     CONTADOR DO PERFIL
     ========================= */

  const counterElement =
    document.getElementById("counterValue");

  const counterBox =
    document.getElementById("profileCounter");

  // Capacidade inicial
  const CAPACIDADE_INICIAL = 100000;

  // Quantidade atual
  let pessoasRestantes = CAPACIDADE_INICIAL;

  // Perguntas que já foram respondidas
  const perguntasRespondidas = new Set();


  /*
   * Quanto cada pergunta reduz a capacidade.
   *
   * Você pode alterar esses valores.
   */

  const pesoPerguntas = {

    idade_relativa: 3000,

    especie: 8000,

    genero: 2000,

    pronomes: 1000,

    planeta: 10000,

    linguagem_amor: 5000,

    hobby: 3000,

    deuses: 4000,

    filhos: 4000,

    monogamia: 6000,

    teletransporte_etico: 7000,

    compatibilidade: 12000,

    eles_usaram: 9000,

    eu_usei: 9000

  };


  /*
   * Atualiza o número na tela
   */

  function atualizarContador() {

    if (pessoasRestantes < 0) {
      pessoasRestantes = 0;
    }

    const milhares =
      Math.round(pessoasRestantes / 1000);

    if (milhares >= 1) {

      counterElement.textContent =
        milhares.toLocaleString("pt-BR") + " mil";

    } else {

      counterElement.textContent =
        pessoasRestantes.toLocaleString("pt-BR");

    }

    // Pequeno efeito visual
    counterBox.classList.remove("changed");

    void counterBox.offsetWidth;

    counterBox.classList.add("changed");

  }


  /*
   * Registra uma pergunta como respondida.
   *
   * Cada pergunta diminui apenas uma vez.
   */

  function registrarResposta(nomePergunta) {

    if (
      !perguntasRespondidas.has(nomePergunta)
    ) {

      perguntasRespondidas.add(nomePergunta);

      const reducao =
        pesoPerguntas[nomePergunta] || 2000;

      pessoasRestantes -= reducao;

      atualizarContador();

    }

  }


  /* =========================
     CAMPOS SELECT
     ========================= */

  document
    .querySelectorAll("select")
    .forEach(select => {

      select.addEventListener("change", function () {

        if (this.value !== "") {

          registrarResposta(this.name);

        }

      });

    });


  /* =========================
     RADIO
     ========================= */

  document
    .querySelectorAll('input[type="radio"]')
    .forEach(radio => {

      radio.addEventListener("change", function () {

        registrarResposta(this.name);

      });

    });


  /* =========================
     CHECKBOX
     ========================= */

  document
    .querySelectorAll('input[type="checkbox"]')
    .forEach(checkbox => {

      checkbox.addEventListener("change", function () {

        /*
         * O [] é removido para que todos
         * os checkbox da mesma pergunta
         * contem como uma única resposta.
         */

        const nome =
          this.name.replace("[]", "");

        registrarResposta(nome);

      });

    });


  /* =========================
     NOME
     ========================= */

  const nomeInput =
    document.querySelector('input[name="nome"]');

  if (nomeInput) {

    nomeInput.addEventListener("input", function () {

      if (this.value.trim() !== "") {

        registrarResposta("nome");

      }

    });

  }


  /* =========================
     PORCENTAGEM ROBÔ
     ========================= */

  const roboRange =
    document.getElementById("roboRange");

  const roboValue =
    document.getElementById("roboValue");

  if (roboRange) {

    roboRange.addEventListener("input", function () {

      roboValue.textContent =
        this.value + "%";

      registrarResposta("porcentagem_robo");

    });

  }


  /* =========================
     DISTÂNCIA
     ========================= */

  const distanciaRange =
    document.getElementById("distanciaRange");

  const distanciaValue =
    document.getElementById("distanciaValue");

  if (distanciaRange) {

    distanciaRange.addEventListener("input", function () {

      distanciaValue.textContent =
        this.value + "%";

      registrarResposta("distancia");

    });

  }


  /* =========================
     DROGAS
     ========================= */

  function mostrarDrogas(mostrar) {

    const campo =
      document.getElementById("tiposDrogas");

    if (!campo) return;

    if (mostrar) {

      campo.classList.remove("hidden");

    } else {

      campo.classList.add("hidden");

      campo
        .querySelectorAll("input")
        .forEach(input => {
          input.checked = false;
        });

    }

  }


  /* =========================
     ZERAR FILTRO
     ========================= */

  function zerarFiltro(nunca) {

    if (nunca) {

      console.log(
        "Filtro zerado: esta espécie nunca foi utilizada como pet ou cobaia."
      );

    }

  }


  /* =========================
     VALOR INICIAL
     ========================= */

  atualizarContador();

</script>
